<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="663" viewBox="0 0 1400 663" role="img" aria-labelledby="title desc">
<title id="title">Manter, separar ou remover áudio</title>
<desc id="desc">Três políticas ilustradas. A separação exige conferir a sincronização e evitar duplicar a fala. A remoção é apenas para apoio silencioso.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#203043" stroke-width="0.6" fill="none"/></pattern></defs>
<rect width="1400" height="663" rx="22" fill="#0b121c"/>
<rect width="1400" height="663" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="58" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">POLÍTICA DE ÁUDIO</text><text x="56" y="110" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Decida onde a fala será reproduzida.</text><rect x="56" y="162" width="408" height="303" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="205" fill="#52dae9" font-size="18" font-weight="700" text-anchor="start">MANTER</text><path d="M 88 266.0 V 280.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 115 259.5 V 286.5" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 142 251.5 V 294.5" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 169 261.5 V 284.5" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 196 246.0 V 300.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 223 256.0 V 290.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 250 264.0 V 282.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 277 254.0 V 292.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 304 262.0 V 284.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 331 249.0 V 297.0" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 358 258.5 V 287.5" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 385 266.5 V 279.5" fill="none" stroke="#52dae9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="354" fill="#f1f5f9" font-size="26" font-weight="700" text-anchor="start">Vídeo com áudio</text><text x="80" y="396" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">Conferir a faixa e os cortes.</text><text x="80" y="438" fill="#52dae9" font-size="18" font-weight="400" text-anchor="start">audio_policy: keep</text><rect x="496" y="162" width="408" height="303" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="520" y="205" fill="#ffb16b" font-size="18" font-weight="700" text-anchor="start">SEPARAR</text><path d="M 528 266.0 V 280.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 555 259.5 V 286.5" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 582 251.5 V 294.5" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 609 261.5 V 284.5" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636 246.0 V 300.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 663 256.0 V 290.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 690 264.0 V 282.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 717 254.0 V 292.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 744 262.0 V 284.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 771 249.0 V 297.0" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 798 258.5 V 287.5" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 825 266.5 V 279.5" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="354" fill="#f1f5f9" font-size="26" font-weight="700" text-anchor="start">Vídeo + WAV</text><text x="520" y="396" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">Uma única cópia audível da fala.</text><text x="520" y="438" fill="#ffb16b" font-size="18" font-weight="400" text-anchor="start">Verificar sincronização</text><rect x="936" y="162" width="408" height="303" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="960" y="205" fill="#a9bbc9" font-size="18" font-weight="700" text-anchor="start">REMOVER</text><path d="M 968 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 995 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1022 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1049 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1076 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1103 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1130 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1157 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1184 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1211 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1238 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1265 273 h 12" fill="none" stroke="#a9bbc9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 970 306 L 1297 241" fill="none" stroke="#ffb16b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="960" y="354" fill="#f1f5f9" font-size="26" font-weight="700" text-anchor="start">Apoio silencioso</text><text x="960" y="396" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">Usar apenas quando fizer sentido.</text><text x="960" y="438" fill="#a9bbc9" font-size="18" font-weight="400" text-anchor="start">-an remove o áudio da cópia</text><rect x="56" y="501" width="1288" height="90" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="539" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="start">Preserve o original e registre a transformação.</text><text x="80" y="572" fill="#a9bbc9" font-size="21" font-weight="400" text-anchor="start">Separar o áudio não garante alinhamento. Ouça o arquivo exportado e evite a fala duplicada.</text><text x="56" y="632" fill="#a9bbc9" font-size="17" font-weight="400" text-anchor="start">Alternativas conceituais de preparação. Nenhum comando de mídia foi executado nesta revisão visual.</text></g>
</svg>