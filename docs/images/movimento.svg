<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Três momentos de uma cena</title><desc id="desc">Entrada de um título, construção de uma relação entre três elementos e repouso para leitura.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#203043" stroke-width="0.6"/></pattern></defs>
<rect width="1400" height="620" rx="22" fill="#0b121c"/><rect width="1400" height="620" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="61" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">DIREÇÃO DE MOVIMENTO</text><text x="56" y="113" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Entrar, explicar e deixar ler.</text><rect x="56" y="161" width="408" height="318" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="202" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">01 / ENTRADA</text><text x="80" y="452" fill="#a9bbc9" font-size="21" font-weight="400" text-anchor="start">Apresenta o assunto.</text><text x="103" y="336" fill="#f1f5f9" font-size="54" font-weight="700" text-anchor="start">IDEIA</text><path d="M 91 365 h 160" fill="none" stroke="#ffb16b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 296 326 h 80 m -12 -12 l 12 12 -12 12" fill="none" stroke="#52dae9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="161" width="408" height="318" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="520" y="202" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">02 / EXPLICAÇÃO</text><text x="520" y="452" fill="#a9bbc9" font-size="21" font-weight="400" text-anchor="start">Mostra a relação.</text><rect x="554" y="255" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="601" y="291" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">A</text><rect x="746" y="255" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="793" y="291" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">B</text><rect x="652" y="344" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="699" y="380" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M 648 283 H 746 M 793 310 L 746 370" fill="none" stroke="#ffb16b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="936" y="161" width="408" height="318" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="960" y="202" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">03 / REPOUSO</text><text x="960" y="452" fill="#a9bbc9" font-size="21" font-weight="400" text-anchor="start">Dá tempo para entender.</text><rect x="994" y="255" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="1041" y="291" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">A</text><rect x="1186" y="255" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="1233" y="291" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">B</text><rect x="1092" y="344" width="94" height="55" rx="12" fill="#1b3544" stroke="#52dae9"/><text x="1139" y="380" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M 1088 283 H 1186 M 1233 310 L 1186 370" fill="none" stroke="#ffb16b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1092 370 H 1040 V 310" fill="none" stroke="#ffb16b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="510" width="1288" height="58" rx="18" fill="#172331" stroke="#2b3e51"/><text x="80" y="547" fill="#52dae9" font-size="20" font-weight="700" text-anchor="start">GSAP / SVG</text><text x="290" y="547" fill="#f1f5f9" font-size="20" font-weight="400" text-anchor="start">Lottie quando ajudar a cena</text><text x="741" y="547" fill="#f1f5f9" font-size="20" font-weight="400" text-anchor="start">Three.js quando o espaço explicar a ideia</text><text x="56" y="599" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Storyboard estático e ilustrativo. As bibliotecas são opções, conforme o projeto e sua compatibilidade.</text></g></svg>