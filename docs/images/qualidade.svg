<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="746" viewBox="0 0 1400 746" role="img" aria-labelledby="title desc">
<title id="title">Inspeção de cortes, imagem, áudio e arquivo</title><desc id="desc">Três frames ao redor de um corte e quatro áreas de revisão, sem declarar aprovação de testes.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#203043" stroke-width="0.6"/></pattern></defs>
<rect width="1400" height="746" rx="22" fill="#0b121c"/><rect width="1400" height="746" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="61" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">CONTROLE DE QUALIDADE</text><text x="56" y="113" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Olhar o corte. Ouvir o arquivo.</text><rect x="56" y="162" width="408" height="204" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="203" fill="#a9bbc9" font-size="24" font-weight="700" text-anchor="start">T − 1/FPS</text><rect x="80" y="224" width="360" height="112" rx="8" fill="#0b1521" stroke="#2b3e51"/><rect x="100" y="246" width="80" height="66" rx="6" fill="#a9bbc9" opacity="0.8"/><rect x="496" y="162" width="408" height="204" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="520" y="203" fill="#ffb16b" font-size="24" font-weight="700" text-anchor="start">T</text><rect x="520" y="224" width="360" height="112" rx="8" fill="#0b1521" stroke="#2b3e51"/><rect x="540" y="246" width="160" height="66" rx="6" fill="#ffb16b" opacity="0.8"/><rect x="936" y="162" width="408" height="204" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="960" y="203" fill="#52dae9" font-size="24" font-weight="700" text-anchor="start">T + 1/FPS</text><rect x="960" y="224" width="360" height="112" rx="8" fill="#0b1521" stroke="#2b3e51"/><rect x="980" y="246" width="240" height="66" rx="6" fill="#52dae9" opacity="0.8"/><text x="56" y="409" fill="#52dae9" font-size="15" font-weight="700" text-anchor="start">IMAGEM</text><text x="56" y="444" fill="#f1f5f9" font-size="23" font-weight="400" text-anchor="start">Texto e enquadramento</text><text x="56" y="474" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">sem cortes acidentais.</text><text x="720" y="409" fill="#52dae9" font-size="15" font-weight="700" text-anchor="start">TEMPO</text><text x="720" y="444" fill="#f1f5f9" font-size="23" font-weight="400" text-anchor="start">Primeiro, meio e último frame</text><text x="720" y="474" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">com buscas não sequenciais.</text><text x="56" y="522" fill="#52dae9" font-size="15" font-weight="700" text-anchor="start">ÁUDIO</text><text x="56" y="557" fill="#f1f5f9" font-size="23" font-weight="400" text-anchor="start">Fala, música e cortes</text><text x="56" y="587" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">conferidos no MP4.</text><text x="720" y="522" fill="#52dae9" font-size="15" font-weight="700" text-anchor="start">ARQUIVO</text><text x="720" y="557" fill="#f1f5f9" font-size="23" font-weight="400" text-anchor="start">Duração, dimensões e streams</text><text x="720" y="587" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">com decodificação completa.</text><rect x="56" y="626" width="1288" height="55" rx="18" fill="#172331" stroke="#2b3e51"/><text x="80" y="661" fill="#f1f5f9" font-size="20" font-weight="400" text-anchor="start">Relatório: passou • falhou • não executado • não se aplica. Registre o que foi observado.</text><text x="56" y="716" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Diagrama de verificações propostas. Não declara aprovação de uma composição ou render.</text></g></svg>