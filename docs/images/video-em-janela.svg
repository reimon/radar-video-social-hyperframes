<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title desc">
<title id="title">Expansão de vídeo em janela para tela cheia</title><desc id="desc">Três estados ilustrativos da mesma paisagem, com contador progressivo e enquadramento maior.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#203043" stroke-width="0.6"/></pattern><symbol id="scene" viewBox="0 0 320 190"><rect width="320" height="190" fill="#182e43"/><circle cx="246" cy="48" r="23" fill="#ffb16b"/><path d="M 0 154 76 47 171 146 230 90 320 168 V 190 H 0Z" fill="#36516b"/><path d="M 0 173 94 104 182 173 270 132 320 169 V 190 H 0Z" fill="#223b50"/><path d="M 107 190 146 155 170 160 195 148 224 157" stroke="#52dae9" stroke-width="4" fill="none"/></symbol></defs>
<rect width="1400" height="710" rx="22" fill="#0b121c"/><rect width="1400" height="710" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="61" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">VÍDEO DENTRO DO VÍDEO</text><text x="56" y="113" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">A janela cresce. O clipe continua.</text><rect x="56" y="160" width="408" height="332" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="198" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">01 / JANELA</text><rect x="80" y="222" width="360" height="220" rx="8" fill="#0b1521" stroke="#2b3e51"/><svg x="173.0" y="280.5" width="174" height="103" viewBox="0 0 320 190"><use href="#scene"/></svg><rect x="181.0" y="288.5" width="55" height="25" rx="5" fill="#0b1521" stroke="#52dae9"/><text x="208.0" y="306.5" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">02 s</text><text x="80" y="472" fill="#a9bbc9" font-size="18" font-weight="400" text-anchor="start">O foco entra na demonstração.</text><rect x="496" y="160" width="408" height="332" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="520" y="198" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">02 / EXPANSÃO</text><rect x="520" y="222" width="360" height="220" rx="8" fill="#0b1521" stroke="#2b3e51"/><svg x="567.0" y="253.0" width="266" height="158" viewBox="0 0 320 190"><use href="#scene"/></svg><rect x="575.0" y="261.0" width="55" height="25" rx="5" fill="#0b1521" stroke="#52dae9"/><text x="602.0" y="279.0" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">05 s</text><text x="520" y="472" fill="#a9bbc9" font-size="18" font-weight="400" text-anchor="start">O enquadramento acompanha.</text><rect x="936" y="160" width="408" height="332" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="960" y="198" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">03 / TELA CHEIA</text><rect x="960" y="222" width="360" height="220" rx="8" fill="#0b1521" stroke="#2b3e51"/><svg x="970.0" y="231.0" width="340" height="202" viewBox="0 0 320 190"><use href="#scene"/></svg><rect x="978.0" y="239.0" width="55" height="25" rx="5" fill="#0b1521" stroke="#52dae9"/><text x="1005.0" y="257.0" fill="#f1f5f9" font-size="14" font-weight="700" text-anchor="middle">07 s</text><text x="960" y="472" fill="#a9bbc9" font-size="18" font-weight="400" text-anchor="start">A ação segue no mesmo clipe.</text><path d="M 80 543 H 1320" fill="none" stroke="#2b3e51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="543" r="6" fill="#52dae9"/><text x="80" y="578" fill="#52dae9" font-size="18" font-weight="400" text-anchor="middle">02 s</text><circle cx="700" cy="543" r="6" fill="#52dae9"/><text x="700" y="578" fill="#52dae9" font-size="18" font-weight="400" text-anchor="middle">05 s</text><circle cx="1320" cy="543" r="6" fill="#52dae9"/><text x="1320" y="578" fill="#52dae9" font-size="18" font-weight="400" text-anchor="middle">07 s</text><text x="56" y="636" fill="#f1f5f9" font-size="21" font-weight="400" text-anchor="start">Continuidade: mesma fonte, tempo controlado pelo runtime e áudio com política explícita.</text><text x="56" y="683" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Sequência ilustrativa. Não representa uma captura ou teste executado do HyperFrames.</text></g></svg>