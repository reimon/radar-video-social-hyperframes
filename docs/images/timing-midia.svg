<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715" role="img" aria-labelledby="title desc">
<title id="title">Tempo da composição e do arquivo-fonte</title>
<desc id="desc">O vídeo ocupa de 2 a 7 segundos na composição e usa de 1 a 6 segundos da fonte. Em 4 segundos da composição, usa 3 segundos da fonte.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#203043" stroke-width="0.6" fill="none"/></pattern></defs>
<rect width="1400" height="715" rx="22" fill="#0b121c"/>
<rect width="1400" height="715" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="58" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">TIMING DE MÍDIA</text><text x="56" y="110" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Onde o clipe entra. De onde ele começa.</text><text x="56" y="164" fill="#52dae9" font-size="17" font-weight="700" text-anchor="start">COMPOSIÇÃO</text><text x="56" y="193" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">data-start = 2 s</text><path d="M 110 252 H 1290" fill="none" stroke="#2b3e51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 110 244 V 260" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="314" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">0 s</text><path d="M 346 244 V 260" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="346" y="314" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">2 s</text><path d="M 936 244 V 260" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="936" y="314" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">7 s</text><path d="M 1290 244 V 260" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1290" y="314" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">10 s</text><rect x="346" y="218" width="590" height="66" rx="8" fill="#193e4b" stroke="#52dae9"/><text x="641" y="260" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">JANELA NA COMPOSIÇÃO: 2 → 7 s</text><text x="56" y="352" fill="#ffb16b" font-size="17" font-weight="700" text-anchor="start">ARQUIVO-FONTE</text><text x="56" y="381" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">data-media-start = 1 s</text><path d="M 110 441 H 1290" fill="none" stroke="#2b3e51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 110 433 V 449" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="501" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">0 s</text><path d="M 228 433 V 449" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="228" y="501" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">1 s</text><path d="M 818 433 V 449" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="501" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">6 s</text><path d="M 1290 433 V 449" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1290" y="501" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="middle">10 s</text><rect x="228" y="407" width="590" height="66" rx="8" fill="#493528" stroke="#ffb16b"/><text x="523" y="449" fill="#f1f5f9" font-size="22" font-weight="700" text-anchor="middle">TRECHO DA FONTE: 1 → 6 s</text><rect x="56" y="521" width="1288" height="128" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="557" fill="#52dae9" font-size="23" font-weight="700" text-anchor="start">data-duration = 5 s</text><text x="80" y="593" fill="#f1f5f9" font-size="24" font-weight="400" text-anchor="start">Na composição em 4 s, o exemplo usa o instante 3 s da fonte.</text><text x="80" y="625" fill="#a9bbc9" font-size="20" font-weight="400" text-anchor="start">Tempo da fonte = data-media-start + (tempo da composição − data-start).</text><text x="56" y="686" fill="#a9bbc9" font-size="17" font-weight="400" text-anchor="start">Exemplo sem alteração de velocidade. O término é o limite da janela, não um frame extra.</text></g>
</svg>