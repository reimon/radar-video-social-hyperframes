<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="695" viewBox="0 0 1400 695" role="img" aria-labelledby="title desc">
<title id="title">Raiz e cenas de uma composição</title>
<desc id="desc">A composição raiz coordena três cenas ilustrativas. IDs de composição e chaves de timeline devem corresponder.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#203043" stroke-width="0.6" fill="none"/></pattern></defs>
<rect width="1400" height="695" rx="22" fill="#0b121c"/>
<rect width="1400" height="695" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="58" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">ARQUITETURA DA COMPOSIÇÃO</text><text x="56" y="110" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Uma raiz organiza. As cenas explicam.</text><rect x="56" y="153" width="1288" height="117" rx="16" fill="#173444" stroke="#52dae9"/><text x="84" y="195" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="start">RAIZ / index.html</text><text x="84" y="237" fill="#a9bbc9" font-size="22" font-weight="400" text-anchor="start">Sequência, duração e camadas compartilhadas</text><path d="M 700 270 V 312 M 260 312 H 1140 M 260 312 V 344 M 700 312 V 344 M 1140 312 V 344" fill="none" stroke="#52dae9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="344" width="408" height="153" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="388" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">CENA 01</text><text x="80" y="432" fill="#f1f5f9" font-size="28" font-weight="700" text-anchor="start">Introdução</text><text x="80" y="469" fill="#a9bbc9" font-size="20" font-weight="400" text-anchor="start">Conteúdo + estilo + timeline</text><rect x="496" y="344" width="408" height="153" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="520" y="388" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">CENA 02</text><text x="520" y="432" fill="#f1f5f9" font-size="28" font-weight="700" text-anchor="start">Demonstração</text><text x="520" y="469" fill="#a9bbc9" font-size="20" font-weight="400" text-anchor="start">Conteúdo + estilo + timeline</text><rect x="936" y="344" width="408" height="153" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="960" y="388" fill="#52dae9" font-size="19" font-weight="700" text-anchor="start">CENA 03</text><text x="960" y="432" fill="#f1f5f9" font-size="28" font-weight="700" text-anchor="start">Encerramento</text><text x="960" y="469" fill="#a9bbc9" font-size="20" font-weight="400" text-anchor="start">Conteúdo + estilo + timeline</text><rect x="56" y="536" width="1288" height="90" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="573" fill="#f1f5f9" font-size="23" font-weight="700" text-anchor="start">IDs únicos no documento montado.</text><text x="80" y="607" fill="#a9bbc9" font-size="21" font-weight="400" text-anchor="start">ID da composição e chave da timeline precisam corresponder.</text><text x="56" y="667" fill="#a9bbc9" font-size="17" font-weight="400" text-anchor="start">Organização ilustrativa. Use template e hosts conforme o contrato da versão instalada.</text></g>
</svg>