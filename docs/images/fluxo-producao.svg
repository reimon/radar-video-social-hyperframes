<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de produção audiovisual</title><desc id="desc">Quatro etapas: planejar, preparar, compor e revisar. As aprovações da skill principal permanecem.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#203043" stroke-width="0.6"/></pattern></defs>
<rect width="1400" height="620" rx="22" fill="#0b121c"/><rect width="1400" height="620" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="61" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">DO ROTEIRO À REVISÃO</text><text x="56" y="113" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Uma produção com etapas claras.</text><rect x="56" y="162" width="298" height="245" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="203" fill="#52dae9" font-size="20" font-weight="700" text-anchor="start">01</text><text x="80" y="260" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="start">PLANEJAR</text><text x="80" y="309" fill="#f1f5f9" font-size="21" font-weight="400" text-anchor="start">Roteiro + storyboard</text><text x="80" y="350" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Cada movimento tem função.</text><path d="M 364 283 h 14 m -6 -6 l 6 6 -6 6" fill="none" stroke="#52dae9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="386" y="162" width="298" height="245" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="410" y="203" fill="#52dae9" font-size="20" font-weight="700" text-anchor="start">02</text><text x="410" y="260" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="start">PREPARAR</text><text x="410" y="309" fill="#f1f5f9" font-size="21" font-weight="400" text-anchor="start">Mídia + áudio</text><text x="410" y="350" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Origem e cortes registrados.</text><path d="M 694 283 h 14 m -6 -6 l 6 6 -6 6" fill="none" stroke="#52dae9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="716" y="162" width="298" height="245" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="740" y="203" fill="#52dae9" font-size="20" font-weight="700" text-anchor="start">03</text><text x="740" y="260" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="start">COMPOR</text><text x="740" y="309" fill="#f1f5f9" font-size="21" font-weight="400" text-anchor="start">Vídeo + animação</text><text x="740" y="350" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Uma timeline sincronizada.</text><path d="M 1024 283 h 14 m -6 -6 l 6 6 -6 6" fill="none" stroke="#52dae9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1046" y="162" width="298" height="245" rx="18" fill="#121f2e" stroke="#2b3e51"/><text x="1070" y="203" fill="#52dae9" font-size="20" font-weight="700" text-anchor="start">04</text><text x="1070" y="260" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="start">REVISAR</text><text x="1070" y="309" fill="#f1f5f9" font-size="21" font-weight="400" text-anchor="start">Prévia + arquivo</text><text x="1070" y="350" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Conferir, ouvir e inspecionar.</text><rect x="56" y="447" width="1288" height="110" rx="18" fill="#172331" stroke="#2b3e51"/><text x="82" y="483" fill="#ffb16b" font-size="15" font-weight="700" text-anchor="start">APROVAÇÕES DA SKILL PRINCIPAL</text><text x="82" y="519" fill="#f1f5f9" font-size="23" font-weight="400" text-anchor="start">Roteiro aprovado → prévia aprovada → exportação e inspeção do arquivo.</text><text x="56" y="592" fill="#a9bbc9" font-size="16" font-weight="400" text-anchor="start">Fluxo conceitual. Publicar em redes sociais exige o escopo e a autorização da skill principal.</text></g></svg>