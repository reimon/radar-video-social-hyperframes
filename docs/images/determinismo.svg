<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="645" viewBox="0 0 1400 645" role="img" aria-labelledby="title desc">
<title id="title">Busca fora de ordem e comparação do mesmo instante</title>
<desc id="desc">Sequência 0, 5,5, 2, 8,5 e 5,5 segundos. As duas capturas em 5,5 segundos devem ser comparadas no mesmo ambiente.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#203043" stroke-width="0.6" fill="none"/></pattern></defs>
<rect width="1400" height="645" rx="22" fill="#0b121c"/>
<rect width="1400" height="645" rx="22" fill="url(#grid)" opacity="0.45"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="56" y="58" fill="#52dae9" font-size="16" font-weight="700" text-anchor="start">BUSCA TEMPORAL REPRODUZÍVEL</text><text x="56" y="110" fill="#f1f5f9" font-size="38" font-weight="700" text-anchor="start">Voltar no tempo deve reconstruir a cena.</text><rect x="56" y="164" width="240" height="143" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="176" y="210" fill="#52dae9" font-size="15" font-weight="700" text-anchor="middle">INÍCIO</text><text x="176" y="267" fill="#f1f5f9" font-size="39" font-weight="700" text-anchor="middle">0 s</text><path d="M 302 234 h 10 m -5 -5 5 5 -5 5" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="318" y="164" width="240" height="143" rx="16" fill="#173444" stroke="#52dae9"/><text x="438" y="210" fill="#52dae9" font-size="15" font-weight="700" text-anchor="middle">CAPTURA A</text><text x="438" y="267" fill="#f1f5f9" font-size="39" font-weight="700" text-anchor="middle">5,5 s</text><path d="M 564 234 h 10 m -5 -5 5 5 -5 5" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="580" y="164" width="240" height="143" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="700" y="210" fill="#52dae9" font-size="15" font-weight="700" text-anchor="middle">RETORNO</text><text x="700" y="267" fill="#f1f5f9" font-size="39" font-weight="700" text-anchor="middle">2 s</text><path d="M 826 234 h 10 m -5 -5 5 5 -5 5" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="842" y="164" width="240" height="143" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="962" y="210" fill="#52dae9" font-size="15" font-weight="700" text-anchor="middle">AVANÇO</text><text x="962" y="267" fill="#f1f5f9" font-size="39" font-weight="700" text-anchor="middle">8,5 s</text><path d="M 1088 234 h 10 m -5 -5 5 5 -5 5" fill="none" stroke="#a9bbc9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1104" y="164" width="240" height="143" rx="16" fill="#173444" stroke="#52dae9"/><text x="1224" y="210" fill="#52dae9" font-size="15" font-weight="700" text-anchor="middle">CAPTURA B</text><text x="1224" y="267" fill="#f1f5f9" font-size="39" font-weight="700" text-anchor="middle">5,5 s</text><path d="M 438 323 V 355 H 1224 V 323" fill="none" stroke="#ffb16b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="831" y="389" fill="#ffb16b" font-size="22" font-weight="700" text-anchor="middle">CAPTURA A ↔ CAPTURA B</text><rect x="56" y="424" width="624" height="145" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="80" y="465" fill="#52dae9" font-size="17" font-weight="700" text-anchor="start">DERIVAR DO TEMPO ABSOLUTO</text><text x="80" y="512" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="start">x = xInicial + velocidade × tempo</text><text x="80" y="546" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">Sementes e dados preparados antes da captura.</text><rect x="720" y="424" width="624" height="145" rx="16" fill="#121f2e" stroke="#2b3e51"/><text x="744" y="465" fill="#52dae9" font-size="17" font-weight="700" text-anchor="start">COMPARAR NO MESMO AMBIENTE</text><text x="744" y="512" fill="#f1f5f9" font-size="24" font-weight="700" text-anchor="start">O mesmo instante, o mesmo conteúdo.</text><text x="744" y="546" fill="#a9bbc9" font-size="19" font-weight="400" text-anchor="start">Investigar diferenças materiais entre as capturas.</text><text x="56" y="613" fill="#a9bbc9" font-size="17" font-weight="400" text-anchor="start">Sequência de teste proposta para uma cena com duração suficiente. Não é resultado de um ensaio.</text></g>
</svg>